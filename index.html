        function getAsciiCurrentFrameText() {
            if (asciiFrames.length > 0) {
                const i = Math.max(0, Math.min(asciiFrames.length - 1, asciiFrameIndex));
                return asciiFrames[i] || '';
            }
            return asciiSourceText || '';
        }

        function getAsciiLinesFromText(text) {
            return String(text || '').replace(/\r\n/g, '\n').split('\n');
        }

        function refreshAsciiMetrics() {
            // Size baseline follows the largest frame across both image sets.
            const primary = asciiFrames.length > 0 ? asciiFrames : [asciiSourceText || ''];
            const secondary = asciiSecondaryFrames.length > 0 ? asciiSecondaryFrames : [];
            const tertiary = asciiTertiaryFrames.length > 0 ? asciiTertiaryFrames : [];
            const source = [...primary, ...secondary, ...tertiary];
            let maxChars = 1;
            let maxLines = 1;
            for (const frame of source) {
                const lines = getAsciiLinesFromText(frame);
                if (lines.length > maxLines) maxLines = lines.length;
                for (const line of lines) {
                    if (line.length > maxChars) maxChars = line.length;
                }
            }
            asciiMaxLineChars = maxChars;
            asciiMaxLineCount = maxLines;
        }

        function tileLinesVertically(lines, targetCount) {
            const src = Array.isArray(lines) && lines.length > 0 ? lines : [''];
            const out = [];
            for (let i = 0; i < targetCount; i++) {
                out.push(src[i % src.length]);
            }
            return out;
        }

        function tileLinesVerticallyFromBottom(lines, targetCount) {
            const src = Array.isArray(lines) && lines.length > 0 ? lines : [''];
            const out = [];
            for (let i = 0; i < targetCount; i++) {
                const idx = (src.length - 1 - (i % src.length) + src.length) % src.length;
                out.push(src[idx]);
            }
            out.reverse();
            return out;
        }

        function getPingPongIndex(step, count) {
            if (count <= 1) return 0;
            const period = (count - 1) * 2;
            // Support negative step seamlessly (no clamp-to-zero jump).
            const p = ((step % period) + period) % period;
            return p <= (count - 1) ? p : (period - p);
        }

        function getStaggeredFrameText(panel) {
            if (asciiFrames.length === 0) return asciiSourceText || '';
            const stagger = Math.max(0, asciiAnimationConfig.staggerFrames | 0);
            const panelOffset = panel === 'left' ? 0 : (panel === 'center' ? stagger : stagger * 2);
            const localStep = Math.max(0, asciiFrameStep - panelOffset);
            const idx = getPingPongIndex(localStep, asciiFrames.length);
            return asciiFrames[idx] || '';
        }

        function getFrameTextByTileWorldIndex(tileWorldIndex, sourceIndex) {
            const sourceIdx = ((sourceIndex % 3) + 3) % 3;
            const framesSource = sourceIdx === 0 ? asciiFrames : (sourceIdx === 1 ? asciiSecondaryFrames : asciiTertiaryFrames);
            if (framesSource.length === 0) return asciiSourceText || '';
            const stagger = Math.max(0, asciiAnimationConfig.staggerFrames | 0);
            // Keep phase continuity by tying delay to a stable world-tile index.
            // Positive index = right side, so right side lags by staggerFrames.
            const localStep = asciiFrameStep - (tileWorldIndex * stagger);
            const m = framesSource.length;
            const n = asciiFrames.length;
            // Master clock: primary frame count. Otherwise short tertiary/secondary cycles look "faster".
            if (n > 1 && m > 1) {
                const phaseIdx = getPingPongIndex(localStep, n);
                const frameIdx = m === n ? phaseIdx : Math.round((phaseIdx * (m - 1)) / (n - 1));
                const clamped = Math.max(0, Math.min(m - 1, frameIdx));
                return framesSource[clamped] || '';
            }
            const frameIdx = getPingPongIndex(localStep, m);
            return framesSource[frameIdx] || '';
        }

        async function loadAsciiFramesFromManifest() {
            const manifestText = await fetchTextIfExists('ascii-frames.json');
            if (!manifestText) return null;
            try {
                const manifest = JSON.parse(manifestText);
                const files = Array.isArray(manifest.frames) ? manifest.frames : [];
                const secondaryFiles = Array.isArray(manifest.secondaryFrames) ? manifest.secondaryFrames : [];
                const tertiaryFiles = Array.isArray(manifest.tertiaryFrames) ? manifest.tertiaryFrames : [];
                // Backward compatibility: intervalMs
                const frameIntervalCandidate =
                    (typeof manifest.frameIntervalMs === 'number' ? manifest.frameIntervalMs : manifest.intervalMs);
                if (typeof frameIntervalCandidate === 'number' && frameIntervalCandidate > 10) {
                    asciiAnimationConfig.frameIntervalMs = Math.floor(frameIntervalCandidate);
                }
                if (typeof manifest.staggerFrames === 'number' && manifest.staggerFrames >= 0) {
                    asciiAnimationConfig.staggerFrames = Math.floor(manifest.staggerFrames);
                }
                if (typeof manifest.moveSpeedPxPerSec === 'number' && manifest.moveSpeedPxPerSec >= 0) {
                    asciiAnimationConfig.moveSpeedPxPerSec = manifest.moveSpeedPxPerSec;
                }
                if (manifest.moveDirection === 'rtl' || manifest.moveDirection === 'ltr') {
                    asciiAnimationConfig.moveDirection = manifest.moveDirection;
                }
                if (typeof manifest.maxFrames === 'number' && manifest.maxFrames >= 1) {
                    asciiAnimationConfig.maxFrames = Math.floor(manifest.maxFrames);
                }
                if (Array.isArray(manifest.patterns) && manifest.patterns.every(v => typeof v === 'string')) {
                    asciiAnimationConfig.patterns = manifest.patterns;
                }
                const loadFrameList = async (fileList) => {
                    const texts = await Promise.all(
                        fileList.map((file) =>
                            typeof file === 'string' && file.trim()
                                ? fetchTextIfExists(file.trim())
                                : Promise.resolve(null),
                        ),
                    );
                    return texts.filter((t) => t !== null);
                };
                const loaded = await loadFrameList(files);
                const loadedSecondary = await loadFrameList(secondaryFiles);
                const loadedTertiary = await loadFrameList(tertiaryFiles);
                asciiSecondaryFrames = loadedSecondary;
                asciiTertiaryFrames = loadedTertiary;
                return loaded.length > 0 ? loaded : null;
            } catch (error) {
                console.warn('Invalid ascii-frames.json format:', error);
                return null;
            }
        }

        async function detectAsciiFramesByPattern() {
            const loaded = [];
            let activePattern = '';
            for (const pattern of asciiAnimationConfig.patterns) {
                const probe = pattern
                    .replace('{n}', '1')
                    .replace('{nn}', '01')
                    .replace('{nnn}', '001');
                const first = await fetchTextIfExists(probe);
                if (first !== null) {
                    activePattern = pattern;
                    loaded.push(first);
                    break;
                }
            }
            if (!activePattern) return [];
            for (let i = 2; i <= asciiAnimationConfig.maxFrames; i++) {
                const n = String(i);
                const nn = n.padStart(2, '0');
                const nnn = n.padStart(3, '0');
                const path = activePattern
                    .replace('{n}', n)
                    .replace('{nn}', nn)
                    .replace('{nnn}', nnn);
                const text = await fetchTextIfExists(path);
                if (text === null) break;
                loaded.push(text);
            }
            return loaded;
        }

        async function ensureAsciiTextLoaded() {
            // 已经有缓存帧时直接返回
            if (asciiFrames.length > 0 || asciiSourceText) return true;

            // 优先：manifest
            const manifestFrames = await loadAsciiFramesFromManifest();
            if (manifestFrames && manifestFrames.length > 0) {
                asciiFrames = manifestFrames;
                // Fallback chain for secondary: manifest.secondaryFrames -> me1.txt -> primary frames
                if (asciiSecondaryFrames.length === 0) {
                    const fallbackSecondary = await fetchTextIfExists('me1.txt');
                    if (fallbackSecondary !== null) asciiSecondaryFrames = [fallbackSecondary];
                    else asciiSecondaryFrames = [...asciiFrames];
                }
                if (asciiTertiaryFrames.length === 0) {
                    asciiTertiaryFrames = [...asciiSecondaryFrames];
                }
                asciiFrameIndex = 0;
                refreshAsciiMetrics();
                return true;
            }

            // 次优：按命名自动探测
            const detectedFrames = await detectAsciiFramesByPattern();
            if (detectedFrames.length > 0) {
                asciiFrames = detectedFrames;
                if (asciiSecondaryFrames.length === 0) {
                    const fallbackSecondary = await fetchTextIfExists('me1.txt');
                    if (fallbackSecondary !== null) asciiSecondaryFrames = [fallbackSecondary];
                    else asciiSecondaryFrames = [...asciiFrames];
                }
                if (asciiTertiaryFrames.length === 0) {
                    asciiTertiaryFrames = [...asciiSecondaryFrames];
                }
                asciiFrameIndex = 0;
                refreshAsciiMetrics();
                return true;
            }

            // 回退：单帧 me.txt
            const fallback = await fetchTextIfExists('me.txt');
            if (fallback === null) throw new Error('Failed to load ASCII source (frames and me.txt missing)');
            asciiSourceText = fallback;
            const fallbackSecondary = await fetchTextIfExists('me1.txt');
            if (fallbackSecondary !== null) asciiSecondaryFrames = [fallbackSecondary];
            if (asciiTertiaryFrames.length === 0) asciiTertiaryFrames = [...asciiSecondaryFrames];
            refreshAsciiMetrics();
            return true;
        }

        function renderAsciiFlat() {
            if (!asciiVisible) return;
            const ctx = asciiCanvas.getContext('2d');
            const dpr = Math.max(1, window.devicePixelRatio || 1);
            const rect = asciiOverlay.getBoundingClientRect();
            const vw = Math.max(1, rect.width);
            const vh = Math.max(1, rect.height);
            const w = Math.floor(vw * dpr);
            const h = Math.floor(vh * dpr);
            // Avoid reallocating backing store every frame (can cause periodic stutter).
            if (asciiCanvasPixelW !== w || asciiCanvasPixelH !== h) {
                asciiCanvas.width = w;
                asciiCanvas.height = h;
                asciiCanvasPixelW = w;
                asciiCanvasPixelH = h;
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            ctx.scale(dpr, dpr);
            const pad = 8;
            const availW = Math.max(1, vw - pad * 2);
            const availH = Math.max(1, vh - pad * 2);

            const fontFamily = '"Courier New", monospace';
            const lineGap = 1.0;
            const widest = Math.max(1, asciiMaxLineChars);
            const maxLineCount = Math.max(1, asciiMaxLineCount);

            // Keep original single-image sizing unchanged:
            // fit one tile to viewport (center image exactly as before).
            let lo = 1;
            let hi = Math.min(400, Math.max(1, Math.floor(availH / maxLineCount)));
            let best = 1;
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                ctx.font = `${mid}px ${fontFamily}`;
                const charW = ctx.measureText('M').width || 1;
                const tileW = widest * charW;
                const totalH = maxLineCount * mid * lineGap;
                if (tileW <= availW && totalH <= availH) {
                    best = mid;
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }

            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            ctx.font = `${best}px ${fontFamily}`;
            const lineH = best * lineGap;
            const totalTextH = maxLineCount * lineH;
            const startY = pad + Math.max(0, (availH - totalTextH) / 2);
            const tileW = Math.max(1, ctx.measureText('M'.repeat(widest)).width);
            const centerStartX = pad + (availW - tileW) / 2;
            // Use always-positive travel distance; map direction in render stage.
            // This avoids negative-floor boundary jumps that look like frame restart.
            const travelPx = Math.max(0, asciiMoveOffsetPx);
            const baseTileShift = Math.floor(travelPx / tileW);
            const wrappedOffset = travelPx - baseTileShift * tileW;
            const rtl = asciiAnimationConfig.moveDirection === 'rtl';
            // Draw enough tiles to fully cover viewport while moving (seamless).
            const firstTileWorldIndex = rtl ? (baseTileShift - 3) : (-baseTileShift - 3);
            const firstTileX = rtl
                ? (centerStartX - tileW * 3 - wrappedOffset)
                : (centerStartX - tileW * 3 + wrappedOffset);
            const tileCount = Math.ceil((availW + tileW * 6) / tileW);
            for (let i = 0; i < tileCount; i++) {
                const x = firstTileX + i * tileW;
                const tileWorldIndex = firstTileWorldIndex + i;
                // Stable 3-way assignment by world index prevents mid-motion source flips.
                // Keeps startup layout cycling: ... tertiary, secondary, primary ... with center primary.
                const sourceIndex = ((tileWorldIndex % 3) + 3) % 3;
                const rawLines = getAsciiLinesFromText(getFrameTextByTileWorldIndex(tileWorldIndex, sourceIndex));
                // Fill viewport vertically for short frames.
                // ascii/ascii2: fill from bottom to top; ascii3: fill from top to bottom.
                const tileLines = rawLines.length < maxLineCount
                    ? (sourceIndex === 2
                        ? tileLinesVertically(rawLines, maxLineCount)
                        : tileLinesVerticallyFromBottom(rawLines, maxLineCount))
                    : rawLines;
                for (let row = 0; row < tileLines.length; row++) {
                    ctx.fillText(tileLines[row], x, startY + row * lineH);
                }
            }
        }

        window.addEventListener('resize', renderAsciiFlat);
        function stepAsciiAnimation(time) {
            if (!asciiVisible) {
                asciiAnimationRaf = 0;
                return;
            }
            if (!asciiMoveLastTime) asciiMoveLastTime = time;
            const dtSec = Math.max(0, (time - asciiMoveLastTime) / 1000);
            asciiMoveLastTime = time;
            // Keep offset monotonic; direction is handled in render mapping.
            asciiMoveOffsetPx += asciiAnimationConfig.moveSpeedPxPerSec * dtSec;
            let needRender = false;
            if (asciiFrames.length > 1) {
                if (!asciiFrameLastSwitch) asciiFrameLastSwitch = time;
                if (time - asciiFrameLastSwitch >= asciiAnimationConfig.frameIntervalMs) {
                    asciiFrameLastSwitch = time;
                    asciiFrameStep++;
                    const last = asciiFrames.length - 1;
                    if (asciiFrameIndex >= last) asciiFrameDirection = -1;
                    else if (asciiFrameIndex <= 0) asciiFrameDirection = 1;
                    asciiFrameIndex += asciiFrameDirection;
                    needRender = true;
                }
            }
            if (dtSec > 0) needRender = true;
            if (needRender) renderAsciiFlat();
            asciiAnimationRaf = requestAnimationFrame(stepAsciiAnimation);
        }

        function startAsciiAnimation() {
            asciiFrameIndex = 0;
            asciiFrameDirection = 1;
            asciiFrameLastSwitch = 0;
            asciiFrameStep = 0;
            asciiMoveOffsetPx = 0;
            asciiMoveLastTime = 0;
            if (!asciiAnimationRaf) asciiAnimationRaf = requestAnimationFrame(stepAsciiAnimation);
        }

        function stopAsciiAnimation() {
            if (asciiAnimationRaf) {
                cancelAnimationFrame(asciiAnimationRaf);
                asciiAnimationRaf = 0;
            }
            asciiFrameLastSwitch = 0;
            asciiMoveLastTime = 0;
        }

        function hideAsciiOverlayAndStopAnimation() {
            asciiVisible = false;
            asciiOverlay.classList.remove('visible');
            stopAsciiAnimation();
        }

        /**
         * @param {{ forceReset?: boolean }} [options]
         * forceReset: 仅 About 打开时传入 — 位移/帧归零并立刻重画，避免 overlay 已显示却仍一帧旧画布；入口「Show ASCII」不传，已显示则连续播放。
         */
        async function startAsciiOverlayAnimation(options = {}) {
            const forceReset = options.forceReset === true;
            await ensureAsciiTextLoaded();
            updateHomeNavOffset();
            const wasAlreadyShown = asciiVisible;
            asciiVisible = true;
            asciiOverlay.classList.add('visible');
            if (forceReset) {
                startAsciiAnimation();
                renderAsciiFlat();
                return;
            }
            requestAnimationFrame(() => {
                if (!wasAlreadyShown) {
                    startAsciiAnimation();
                } else if (!asciiAnimationRaf) {
                    asciiAnimationRaf = requestAnimationFrame(stepAsciiAnimation);
                }
                renderAsciiFlat();
            });
        }

        // 调试/运行时控制：在控制台可改速度，例如 setAsciiFrameInterval(80)
        window.setAsciiFrameInterval = (ms) => {
            const value = Number(ms);
            if (!Number.isFinite(value) || value < 10) return;
            asciiAnimationConfig.frameIntervalMs = Math.floor(value);
        };
        const isLeftTypingPhase = () => (
            leftPhase === 'typing' ||
            leftPhase === 'noResponse' ||
            leftPhase === 'finalTyping' ||
            leftPhase === 'finalContinue' ||
            leftPhase === 'hiring' ||
            leftPhase === 'hiringResponse' ||
            leftPhase === 'closing'
        );
        const isRightTypingPhase = () => (
            rightPhase === 'typing' ||
            rightPhase === 'response1' ||
            rightPhase === 'final'
        );
        leftFlatCanvas.addEventListener('wheel', (event) => {
            if (isLeftTypingPhase()) return;
            event.preventDefault();
            leftScrollOffset = Math.max(0, Math.min(leftMaxScroll, leftScrollOffset + (event.deltaY > 0 ? 70 : -70)));
        }, { passive: false });
        rightFlatCanvas.addEventListener('wheel', (event) => {
            if (isRightTypingPhase()) return;
            event.preventDefault();
            rightScrollOffset = Math.max(0, Math.min(rightMaxScroll, rightScrollOffset + (event.deltaY > 0 ? 70 : -70)));
        }, { passive: false });

        function playTypewriterSoundFlat() {
            const ctx = globalAudioContext;
            if (!ctx || ctx.state !== 'running') return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(85 + Math.random() * 20, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 0.002);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.03);
        }

        function setupFlatCanvas(canvas) {
            const dpr = Math.max(1, window.devicePixelRatio || 1);
            const rect = canvas.getBoundingClientRect();
            const w = Math.max(1, Math.floor(rect.width * dpr));
            const h = Math.max(1, Math.floor(rect.height * dpr));
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            return { ctx, width: rect.width, height: rect.height };
        }

        function wrapTextToLines(ctx, text, maxWidth) {
            const words = text.split(' ');
            const wrapped = [];
            let line = '';
            for (const word of words) {
                const test = line ? `${line} ${word}` : word;
                if (ctx.measureText(test).width > maxWidth && line) {
                    wrapped.push(line);
                    line = word;
                } else {
                    line = test;
                }
            }
            wrapped.push(line);
            return wrapped;
        }

        function drawFlatPanel(canvas, lines, scrollOffset, side, time) {
            const { ctx, width, height } = setupFlatCanvas(canvas);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            ctx.font = '28px "Space Mono", monospace';
            ctx.textBaseline = 'top';
            const padX = 22;
            const padY = 22;
            const lineHeight = 38;
            const maxWidth = Math.max(10, width - padX * 2);

            const visualLines = [];
            for (const raw of lines) {
                if (!raw) {
                    visualLines.push('');
                    continue;
                }
                visualLines.push(...wrapTextToLines(ctx, raw, maxWidth));
            }

            let extraLineCount = 0;
            if (side === 'left') {
                if (leftPhase === 'options1' || leftPhase === 'hiringOptions') extraLineCount = 1; // input line
                if (leftPhase === 'options2') {
                    const yesW = ctx.measureText('yes').width;
                    const noW = ctx.measureText('no').width;
                    const gap = 18;
                    const twoLine = (padX + yesW + gap + noW > width - padX - 14);
                    // Small safety padding avoids clipping when options wrap to two lines.
                    extraLineCount = twoLine ? 2.25 : 1.25;
                }
            }
            const totalContentHeight = (visualLines.length + extraLineCount) * lineHeight;
            const maxScroll = Math.max(0, totalContentHeight - (height - padY * 2));

            let clampedScroll = Math.max(0, Math.min(maxScroll, scrollOffset));
            if (side === 'left' && leftNeedSnapToBottom) {
                clampedScroll = maxScroll;
            }
            let y = padY - clampedScroll;
            for (const line of visualLines) {
                if (y > height - padY) break;
                if (y + lineHeight >= padY) {
                    ctx.fillText(line, padX, y);
                }
                y += lineHeight;
            }
            // Blinking cursor at typing tail (both sides), matching old behavior.
            const leftTypingNow = side === 'left' && (
                leftPhase === 'typing' ||
                leftPhase === 'noResponse' ||
                leftPhase === 'finalTyping' ||
                leftPhase === 'finalContinue'
            );
            const rightTypingNow = side === 'right' && (
                rightPhase === 'typing' ||
                rightPhase === 'response1' ||
                rightPhase === 'final'
            );
            if ((leftTypingNow || rightTypingNow) && visualLines.length > 0) {
                const blinkOn = Math.floor((time || performance.now()) / 500) % 2 === 0;
                if (blinkOn) {
                    const lastLine = visualLines[visualLines.length - 1] || '';
                    const cursorX = padX + ctx.measureText(lastLine).width + 4;
                    const cursorY = padY + (visualLines.length - 1) * lineHeight - clampedScroll;
                    if (cursorY >= padY - lineHeight && cursorY <= height - padY) {
                        ctx.fillRect(cursorX, cursorY + 2, 4, 30);
                    }
                }
            }
            if (maxScroll > 0) {
                const trackX = width - 8;
                const trackY = padY;
                const trackH = height - padY * 2;
                const thumbH = Math.max(30, (trackH * trackH) / (totalContentHeight || trackH));
                const thumbY = trackY + (trackH - thumbH) * (clampedScroll / maxScroll);
                ctx.fillStyle = '#fff';
                ctx.fillRect(trackX, thumbY, 2, thumbH);
            }
            const contentBottomY = padY + totalContentHeight - clampedScroll;

            if (side === 'left') {
                // Place prompt/options exactly on the next text line baseline.
                let promptY = padY + visualLines.length * lineHeight - clampedScroll;
                const promptX = padX;
                ctx.font = '28px "Space Mono", monospace';
                ctx.fillStyle = '#fff';
                ctx.textBaseline = 'top';

                if (leftPhase === 'options1' || leftPhase === 'hiringOptions') {
                    const input = leftPhase === 'options1' ? leftUserInput : leftHiringInput;
                    const promptText = `>${input}`;
                    ctx.fillText(promptText, promptX, promptY);
                    if (Math.floor((time || performance.now()) / 500) % 2 === 0) {
                        const w = ctx.measureText(promptText).width;
                        ctx.fillRect(promptX + w + 4, promptY + 2, 4, 30);
                    }
                    leftYesHitRect = null;
                    leftNoHitRect = null;
                    leftHoveredChoice = '';
                } else if (leftPhase === 'options2') {
                    const yesText = 'yes';
                    const noText = 'no';
                    const yesW = ctx.measureText(yesText).width;
                    const noW = ctx.measureText(noText).width;
                    const gap = 18;
                    let yesX = promptX;
                    let noX = promptX + yesW + gap;
                    let noY = promptY;
                    if (noX + noW > width - padX - 14) {
                        noX = promptX;
                        noY = promptY + lineHeight;
                    }

                    leftYesHitRect = leftPhase === 'options2' ? { x: yesX, y: promptY, w: yesW, h: lineHeight } : null;
                    leftNoHitRect = leftPhase === 'options2' ? { x: noX, y: noY, w: noW, h: lineHeight } : null;

                    const drawChoice = (text, x, y, hovered) => {
                        if (hovered) {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(x - 4, y - 2, ctx.measureText(text).width + 8, 34);
                            ctx.fillStyle = '#000';
                            ctx.fillText(text, x, y);
                            ctx.fillStyle = '#fff';
                        } else {
                            ctx.fillText(text, x, y);
                        }
                    };

                    const yesSelected = leftFinalChoice === 'yes';
                    const noSelected = leftFinalChoice === 'no';
                    drawChoice(yesText, yesX, promptY, leftHoveredChoice === 'yes' || yesSelected);
                    drawChoice(noText, noX, noY, leftHoveredChoice === 'no' || noSelected);
                } else {
                    leftYesHitRect = null;
                    leftNoHitRect = null;
                    leftHoveredChoice = '';
                }
                // Final "go back" clickable line after closing is complete.
                const backText = currentLanguage === 'zh' ? 'Click here to go back.' : 'Click here to go back.';
                if (leftPhase === 'done') {
                    let backY = null;
                    for (let i = 0; i < visualLines.length; i++) {
                        if ((visualLines[i] || '').trim() === backText) {
                            backY = padY + i * lineHeight - clampedScroll;
                            break;
                        }
                    }
                    if (backY !== null) {
                        const backW = ctx.measureText(backText).width;
                        leftBackHitRect = { x: padX, y: backY, w: backW, h: lineHeight };
                        if (leftBackHovered) {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(padX - 4, backY - 2, backW + 8, 34);
                            ctx.fillStyle = '#000';
                            ctx.fillText(backText, padX, backY);
                            ctx.fillStyle = '#fff';
                        }
                    } else {
                        leftBackHitRect = null;
                        leftBackHovered = false;
                    }
                } else {
                    leftBackHitRect = null;
                    leftBackHovered = false;
                }
            } else if (side === 'right' && (rightPhase === 'options1' || rightPhase === 'options2')) {
                const promptY = padY + visualLines.length * lineHeight - clampedScroll;
                const promptX = padX;
                const prompt = `>${rightUserInput}`;
                ctx.font = '28px "Space Mono", monospace';
                ctx.fillStyle = '#fff';
                ctx.textBaseline = 'top';
                ctx.fillText(prompt, promptX, promptY);
                if (Math.floor((time || performance.now()) / 500) % 2 === 0) {
                    const w = ctx.measureText(prompt).width;
                    ctx.fillRect(promptX + w + 4, promptY + 2, 4, 30);
                }
                if (rightPhase === 'options2') {
                    const targetText = 'Only ONE of the statements is FALSE.';
                    let targetY = null;
                    for (let i = 0; i < visualLines.length; i++) {
                        if ((visualLines[i] || '').trim() === targetText) {
                            targetY = padY + i * lineHeight - clampedScroll;
                            break;
                        }
                    }
                    if (targetY !== null) {
                        const targetW = ctx.measureText(targetText).width;
                        rightClickableLineRect = { x: promptX, y: targetY, w: targetW, h: lineHeight };
                        if (rightClickableLineHovered) {
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(promptX - 4, targetY - 2, targetW + 8, 34);
                            ctx.fillStyle = '#000';
                            ctx.fillText(targetText, promptX, targetY);
                            ctx.fillStyle = '#fff';
                        }
                    } else {
                        rightClickableLineRect = null;
                        rightClickableLineHovered = false;
                    }
                } else {
                    rightClickableLineRect = null;
                    rightClickableLineHovered = false;
                }
            }
            if (side === 'left' && leftNeedSnapToBottom) {
                leftNeedSnapToBottom = false;
            }
            return { maxScroll, contentBottomY, panelHeight: height };
        }

        function flattenStatementLines(side) {
            const base = side === 'left'
                ? [
                    ...getStatementText('left.typingLines', []),
                    ...getStatementText('left.noResponseLines', []),
                    ...getStatementText('left.finalLines', []),
                    ...getStatementText('left.finalContinueLines', []),
                    ...getStatementText('left.hiringLines', []),
                    ...getStatementText('left.hiringResponseLines', []),
                    ...getStatementText('left.closingLines', [])
                ]
                : [
                    ...getStatementText('right.typingLines', []),
                    ...getStatementText('right.response1Lines', []),
                    ...getStatementText('right.finalLines', [])
                ];
            return base.map(v => (typeof v === 'string' ? v : '')).filter(v => v !== null);
        }

        function resetFlatState() {
            leftRenderedLines = [];
            rightRenderedLines = [];
            leftLineIndex = 0;
            leftCharIndex = 0;
            rightLineIndex = 0;
            rightCharIndex = 0;
            leftLastTick = 0;
            rightLastTick = 0;
            leftScrollOffset = 0;
            rightScrollOffset = 0;
            rightStartTime = -1;
            rightResumeTime = -1;
            leftStarted = false;
            leftPhase = 'idle';
            rightPhase = 'idle';
            leftMaxScroll = 0;
            rightMaxScroll = 0;
            leftPhaseEnd = 0;
            rightPhaseEnd = 0;
            leftUserInput = '';
            leftYesHitRect = null;
            leftNoHitRect = null;
            leftHoveredChoice = '';
            leftNeedSnapToBottom = false;
            leftFinalChoice = '';
            rightStartDelayUntil = 0;
            rightUserInput = '';
            rightOptions2Saw1 = false;
            rightOptions2Saw2 = false;
            rightOptions2Saw3 = false;
            rightOptions2HintShown = false;
            rightClickableLineRect = null;
            rightClickableLineHovered = false;
            rightPauseAtIndex = -1;
            rightPausedForLeft = false;
            leftHiringInput = '';
            rightResumeAt = 0;
            rightDoneAt = 0;
            leftStartDelayUntil = 0;
            leftPendingPhase = '';
            leftBackHitRect = null;
            leftBackHovered = false;
        }

        function stepTypewriter(time, sourceLines, renderedLines, side) {
            const speed = typingSpeedProfiles[currentTypingSpeedMode] || typingSpeedProfiles.formal;
            const delay = speed.charDelay;
            const linePause = speed.linePause;
            if (side === 'left') {
                if (leftLineIndex >= sourceLines.length) return;
                if (time - leftLastTick < delay) return;
                const line = sourceLines[leftLineIndex] ?? '';
                renderedLines[leftLineIndex] = (renderedLines[leftLineIndex] || '') + (line[leftCharIndex] || '');
                leftCharIndex++;
                leftLastTick = time;
                playTypewriterSoundFlat();
                if (leftCharIndex > line.length - 1) {
                    leftLineIndex++;
                    leftCharIndex = 0;
                    leftLastTick = time + linePause;
                    if (leftLineIndex < sourceLines.length) renderedLines[leftLineIndex] = '';
                }
                return;
            }
            if (rightLineIndex >= sourceLines.length) return;
            if (time - rightLastTick < delay) return;
            const line = sourceLines[rightLineIndex] ?? '';
            renderedLines[rightLineIndex] = (renderedLines[rightLineIndex] || '') + (line[rightCharIndex] || '');
            rightCharIndex++;
            rightLastTick = time;
            playTypewriterSoundFlat();
            if (rightCharIndex > line.length - 1) {
                rightLineIndex++;
                rightCharIndex = 0;
                rightLastTick = time + linePause;
                if (rightLineIndex < sourceLines.length) renderedLines[rightLineIndex] = '';
            }
        }

        function toggleControls() {
            // Left side prompt/options are rendered directly in canvas.
            leftControls.style.display = 'none';
            leftPrompt.style.display = 'none';
            leftYesBtn.style.display = 'none';
            leftNoBtn.style.display = 'none';
            rightControls.style.display = 'none';
            rightInput.style.display = 'none';
            rightOpt1.style.display = 'none';
            rightOpt2.style.display = 'none';
            rightOpt3.style.display = 'none';
            rightContinueBtn.style.display = 'none';
            leftPromptText.textContent = leftUserInput;
        }

        function positionControls(controlEl, layoutInfo) {
            const lineHeight = 38;
            const margin = 2;
            const minY = 14;
            const maxY = Math.max(minY, layoutInfo.panelHeight - 70);
            const rawY = layoutInfo.contentBottomY + margin;
            // Snap to text line grid so prompt/options align with canvas text rhythm.
            const y = Math.max(minY, Math.min(maxY, Math.ceil(rawY / lineHeight) * lineHeight));
            controlEl.style.top = `${y}px`;
        }

        function runFlatStatement() {
            resetFlatState();
            flatState = {
                leftTyping: getStatementText('left.typingLines', []),
                leftNoResponse: getStatementText('left.noResponseLines', []),
                leftFinal: getStatementText('left.finalLines', []),
                leftFinalContinue: getStatementText('left.finalContinueLines', []),
                leftHiring: getStatementText('left.hiringLines', []),
                leftHiringResponse: getStatementText('left.hiringResponseLines', []),
                leftClosing: [
                    ...getStatementText('left.closingLines', []),
                    'Click here to go back.'
                ],
                rightTyping: getStatementText('right.typingLines', []),
                rightResponse1: getStatementText('right.response1Lines', []),
                rightFinal: getStatementText('right.finalLines', []),
                leftActive: [],
                rightActive: []
            };

            flatState.rightActive = [...flatState.rightTyping];
            rightPhaseEnd = flatState.rightActive.length;
            // Left starts first in original pacing.
            leftStarted = true;
            leftPhase = 'typing';
            flatState.leftActive = [...flatState.leftTyping];
            leftPhaseEnd = flatState.leftActive.length;
            if (leftPhaseEnd > 0) leftRenderedLines[0] = '';
            toggleControls();

            flatAnimating = true;
            const tick = (time) => {
                if (!flatAnimating) return;

                if (rightPhase === 'typing' || rightPhase === 'response1' || rightPhase === 'final') {
                    stepTypewriter(time, flatState.rightActive, rightRenderedLines, 'right');
                    if (
                        rightPhase === 'final' &&
                        !rightPausedForLeft &&
                        rightPauseAtIndex >= 0 &&
                        rightLineIndex > rightPauseAtIndex
                    ) {
                        rightPausedForLeft = true;
                        rightPhase = 'paused';
                        leftPendingPhase = 'hiring';
                        leftStartDelayUntil = performance.now() + 1000;
                        toggleControls();
                    }
                    if (rightLineIndex >= rightPhaseEnd) {
                        if (rightPhase === 'typing') rightPhase = 'options1';
                        else if (rightPhase === 'response1') rightPhase = 'options2';
                        else {
                            rightPhase = 'done';
                            rightDoneAt = performance.now();
                        }
                        toggleControls();
                    }
                }
                if (rightPhase === 'paused' && rightResumeAt > 0 && time >= rightResumeAt) {
                    rightPhase = 'final';
                    rightResumeAt = 0;
                }

                if (leftStarted && (
                    leftPhase === 'typing' ||
                    leftPhase === 'noResponse' ||
                    leftPhase === 'finalTyping' ||
                    leftPhase === 'finalContinue' ||
                    leftPhase === 'hiring' ||
                    leftPhase === 'hiringResponse' ||
                    leftPhase === 'closing'
                )) {
                    stepTypewriter(time, flatState.leftActive, leftRenderedLines, 'left');
                    if (leftLineIndex >= leftPhaseEnd) {
                        if (leftPhase === 'typing') {
                            leftPhase = 'options1';
                            // Ensure prompt row is visible when first input appears.
                            leftScrollOffset = leftMaxScroll;
                        } else if (leftPhase === 'noResponse') {
                            flatState.leftActive.push(...flatState.leftFinal);
                            leftPhaseEnd = flatState.leftActive.length;
                            leftPhase = 'finalTyping';
                        } else if (leftPhase === 'finalTyping') {
                            leftPhase = 'options2';
                            // Snap once after options are part of the measured content height.
                            leftNeedSnapToBottom = true;
                            // Force immediate clamped-to-bottom render on the transition frame.
                            leftScrollOffset = Number.MAX_SAFE_INTEGER;
                        } else if (leftPhase === 'hiring') {
                            leftPhase = 'hiringOptions';
                        } else if (leftPhase === 'hiringResponse') {
                            leftPhase = 'waitingRightDone';
                            rightResumeAt = performance.now() + 1000;
                        } else if (leftPhase === 'closing') {
                            leftPhase = 'done';
                        } else {
                            // Left narrative reached "I'll connect you to him." line end.
                            if (leftFinalChoice === 'yes') {
                                rightStartDelayUntil = performance.now() + 2000;
                            }
                            leftPhase = 'done';
                        }
                        toggleControls();
                    }
                }

                // Start right timeline only after left storyline is fully done.
                if (rightPhase === 'idle' && leftPhase === 'done' && time >= rightStartDelayUntil) {
                    rightPhase = 'typing';
                    if (rightPhaseEnd > 0 && rightRenderedLines.length === 0) {
                        rightRenderedLines[0] = '';
                    }
                    toggleControls();
                }
                if (leftPhase === 'waitingRightDone' && rightPhase === 'done' && rightDoneAt > 0 && !leftPendingPhase) {
                    leftPendingPhase = 'closing';
                    leftStartDelayUntil = performance.now() + 1000;
                }
                if (leftPendingPhase && time >= leftStartDelayUntil) {
                    if (leftPendingPhase === 'hiring') {
                        leftPhase = 'hiring';
                        flatState.leftActive.push(...flatState.leftHiring);
                        leftPhaseEnd = flatState.leftActive.length;
                    } else if (leftPendingPhase === 'closing') {
                        leftPhase = 'closing';
                        flatState.leftActive.push(...flatState.leftClosing);
                        leftPhaseEnd = flatState.leftActive.length;
                    }
                    leftPendingPhase = '';
                    leftStartDelayUntil = 0;
                    toggleControls();
                }

                const leftLayout = drawFlatPanel(leftFlatCanvas, leftRenderedLines, leftScrollOffset, 'left', time);
                const rightLayout = drawFlatPanel(rightFlatCanvas, rightRenderedLines, rightScrollOffset, 'right', time);
                leftMaxScroll = leftLayout.maxScroll;
                rightMaxScroll = rightLayout.maxScroll;
                if (isLeftTypingPhase()) leftScrollOffset = leftMaxScroll;
                if (isRightTypingPhase()) rightScrollOffset = rightMaxScroll;
                if (leftPhase === 'options2') leftScrollOffset = Math.max(0, Math.min(leftMaxScroll, leftScrollOffset));

                if (rightControls.style.display !== 'none') {
                    positionControls(rightControls, rightLayout);
                }
                flatAnimationId = requestAnimationFrame(tick);
            };
            flatAnimationId = requestAnimationFrame(tick);
        }

        function stopFlatStatement() {
            flatAnimating = false;
            if (flatAnimationId) {
                cancelAnimationFrame(flatAnimationId);
                flatAnimationId = 0;
            }
        }

        async function openArtistStatementFromAbout() {
            if (!resourcesReady) return;
            stopAboutStatementFloat();
            await applyLanguage(currentLanguage);
            hideAsciiOverlayAndStopAnimation();
            setHomeNavVisible(false);
            if (aboutPanel) {
                aboutPanel.classList.remove('visible');
                aboutPanel.setAttribute('aria-hidden', 'true');
            }
            if (gamesPanel) {
                gamesPanel.classList.remove('visible');
                gamesPanel.setAttribute('aria-hidden', 'true');
                showGamesListView();
            }
            closeContactPanel();
            entryScreen.classList.remove('visible');
            flatStatement.classList.add('visible');
            runFlatStatement();
        }

        function gamePlaytimeText(detail) {
            const t = detail.playtime;
            if (t == null) return '—';
            const s = String(t).trim();
            return s || '—';
        }

        function parseDetailYear(year) {
            if (typeof year === 'number' && Number.isFinite(year)) return year;
            if (typeof year === 'string') {
                const t = year.trim();
                if (!t) return null;
                const n = parseInt(t, 10);
                return Number.isFinite(n) ? n : null;
            }
            return null;
        }

        function formatDetailYear(year) {
            const n = parseDetailYear(year);
            return n != null ? String(n) : '—';
        }

        async function fetchGameDetailListMeta(detailFile, cacheBust = '') {
            const path = (detailFile || '').trim();
            if (!path) return { sortYear: null, hiddenFromHome: false, detail: null };
            try {
                const url = cacheBust ? `${path}${path.includes('?') ? '&' : '?'}${cacheBust}` : path;
                const res = await fetchWithTimeout(url, { cache: 'no-store' }, 12000);
                if (!res.ok) return { sortYear: null, hiddenFromHome: false, detail: null };
                const detail = await res.json();
                return {
                    sortYear: parseDetailYear(detail.year),
                    hiddenFromHome: detail.hiddenFromHome === true,
                    detail,
                };
            } catch {
                return { sortYear: null, hiddenFromHome: false, detail: null };
            }
        }

        function isHttpPlayUrl(url) {
            try {
                const u = new URL(url, window.location.href);
                return u.protocol === 'http:' || u.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function gameScreenshotFolder(game, detailPath, detail) {
            const manual = (detail && typeof detail.screenshotDir === 'string') ? detail.screenshotDir.trim() : '';
            if (manual) return manual.replace(/\/+$/, '');
            const raw = (detailPath || '').trim();
            const base = raw.split('/').pop() || '';
            const stem = base.replace(/\.json$/i, '') || ((game && game.id) ? String(game.id).trim() : '');
            return `game-screenshots/${stem}`;
        }

        function gameDetailTextCandidates(game, detailPath, detail) {
            const explicit = (detail && typeof detail.detailTextFile === 'string') ? detail.detailTextFile.trim() : '';
            if (explicit) return [explicit];
            const folder = gameScreenshotFolder(game, detailPath, detail);
            return [
                `${folder}/detail.txt`,
                `${folder}/description.txt`,
                `${folder}/about.txt`,
                `${folder}/text.txt`
            ];
        }

        async function fetchGameDetailTextRaw(game, detailPath, detail) {
            const candidates = gameDetailTextCandidates(game, detailPath, detail);
            for (let i = 0; i < candidates.length; i++) {
                const path = (candidates[i] || '').trim();
                if (!path) continue;
                try {
                    const r = await fetchWithTimeout(path, { cache: 'no-store' }, 10000);
                    if (!r.ok) continue;
                    return await r.text();
                } catch {}
            }
            return '';
        }

        function renderGameDetailText(targetEl, raw) {
            if (!targetEl) return;
            targetEl.replaceChildren();
            const root = document.createElement('div');
            root.className = 'games-detail-text-root';
            const lines = String(raw || '').replace(/\r\n/g, '\n').split('\n');
            let hasNonEmpty = false;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line === '') {
                    const spacer = document.createElement('div');
                    spacer.className = 'games-detail-text-spacer';
                    spacer.setAttribute('aria-hidden', 'true');
                    root.appendChild(spacer);
                    continue;
                }
                hasNonEmpty = true;
                const row = document.createElement('div');
                row.className = 'games-detail-text-line';
                row.textContent = line;
                root.appendChild(row);
            }
            if (!hasNonEmpty) {
                const row = document.createElement('div');
                row.className = 'games-detail-text-line';
                row.textContent = '—';
                root.appendChild(row);
            }
            targetEl.appendChild(root);
        }

        function normalizeScreenshotUrl(entry) {
            const s = String(entry || '').trim();
            if (!s) return '';
            if (/^https?:\/\//i.test(s)) return s;
            return s;
        }

        async function fetchGameScreenshotUrls(game, detailPath, detail) {
            const folder = gameScreenshotFolder(game, detailPath, detail);
            if (!folder) return [];

            /*
             * 截图 URL 只来自声明式数据，不做运行时探测：
             * 1) detail.screenshots — 相对站点根或 https 绝对地址
             * 2) 否则尝试 game-screenshots/<stem>/manifest.json（文件名数组）
             */
            if (detail && Array.isArray(detail.screenshots)) {
                const out = [];
                const seen = new Set();
                for (const item of detail.screenshots) {
                    const u = normalizeScreenshotUrl(item);
                    if (!u || seen.has(u)) continue;
                    seen.add(u);
                    out.push(u);
                }
                return out;
            }

            const urls = [];
            const seen = new Set();
            const addUrl = (u) => {
                if (!u || seen.has(u)) return;
                seen.add(u);
                urls.push(u);
            };

            // Preferred: manifest in each game's screenshot folder.
            try {
                const m = await fetchWithTimeout(`${folder}/manifest.json`, { cache: 'no-store' }, 8000);
                if (m.ok) {
                    const list = await m.json();
                    if (Array.isArray(list)) {
                        list.forEach((name) => {
                            const n = String(name || '').trim();
                            if (n) addUrl(`${folder}/${n}`);
                        });
                        if (urls.length) return urls;
                    }
                }
            } catch {}

            return urls;
        }

        function createGalleryImageSlot(src, alt, useLazyLoad) {
            const wrap = document.createElement('div');
            wrap.className = 'games-detail-gallery-item';

            loadLayer.className = 'games-detail-gallery-img-loading';

            img.onload = done;
            img.onerror = done;

            if (gamesPanelScroll) gamesPanelScroll.scrollTop = 0;
            gamesDetailBody.replaceChildren();

                if (op !== gameDetailOpSeq) return;
                gamesDetailBody.replaceChildren();
                const err = document.createElement('p');
                err.className = 'games-detail-err';

            const playUrl = (detail.playUrl || '').trim();

            const roleValue = document.createElement('span');

            const platformValue = document.createElement('span');
            platformValue.className = 'games-detail-subitem games-detail-subitem--value';
            platformValue.textContent = (detail.platform && String(detail.platform).trim()) || '—';
            subline.appendChild(platformValue);

            const playValueSpacer = document.createElement('span');
            playValueSpacer.className = 'games-detail-subitem games-detail-subitem--value';
            playValueSpacer.textContent = '';
            subline.appendChild(playValueSpacer);

            const content = document.createElement('div');

            const baseAlt = (game.title && String(game.title).trim()) || (game.id && String(game.id).trim()) || 'game';
            void (async () => {

                try {
                    urls = await fetchGameScreenshotUrls(game, detailPath, detail);

        function shouldFitGameOverviewTitles() {
            return gamesPanel && gamesPanel.classList.contains('visible')
                && gamesListView && !gamesListView.hidden;
        }

        function fitGamesOverviewTitles(container) {
            if (!container) return;
            container.querySelectorAll('.games-row-title').forEach((el) => {
                el.classList.remove('games-row-title--clamped');
                el.style.fontSize = '';
                el.style.lineHeight = '';
            });
        }

        const GAMES_OVERVIEW_COLUMNS = 3;

        function equalizeGameRowHeights(container) {
            if (!container) return;
            const buttons = container.querySelectorAll('.games-row');
            if (buttons.length === 0) return;
            const list = Array.from(buttons);
            list.forEach((el) => {
                el.style.minHeight = '';
            });
            void container.offsetHeight;
            for (let i = 0; i < list.length; i += GAMES_OVERVIEW_COLUMNS) {
                const rowItems = list.slice(i, i + GAMES_OVERVIEW_COLUMNS);
                let maxH = 0;
                rowItems.forEach((el) => {
                    maxH = Math.max(maxH, el.offsetHeight);
                });
                const h = Math.ceil(maxH);
                rowItems.forEach((el) => {
                    el.style.minHeight = `${h}px`;
                });
            }
        }

        let gamesTitleFitRaf = 0;

        /** Run title fit in the same turn as showing the panel so the first paint is already correct (avoids one frame at wrong font sizes after display:none → flex). */
        function syncFitGamesOverviewIfVisible() {
            if (!gamesPanel || !gamesListRoot || !shouldFitGameOverviewTitles()) return;
            void gamesPanel.offsetWidth;
            fitGamesOverviewTitles(gamesListRoot);
            equalizeGameRowHeights(gamesListRoot);
        }

        function scheduleFitGamesOverviewTitles() {
            if (!gamesListRoot) return;
            cancelAnimationFrame(gamesTitleFitRaf);
            gamesTitleFitRaf = requestAnimationFrame(() => {
                if (!shouldFitGameOverviewTitles()) return;
                fitGamesOverviewTitles(gamesListRoot);
                equalizeGameRowHeights(gamesListRoot);
            });
        }

        let gamesTitleFitResizeTimer = 0;
        function onGamesTitleFitResize() {
            if (!shouldFitGameOverviewTitles()) return;
            window.clearTimeout(gamesTitleFitResizeTimer);
            gamesTitleFitResizeTimer = window.setTimeout(() => scheduleFitGamesOverviewTitles(), 120);
        }

        function preloadGameThumbnails(games) {
            const list = Array.isArray(games) ? games : [];
            for (let i = 0; i < list.length; i++) {
                const src = (list[i].image || '').trim();
                if (!src) continue;
                const im = new Image();
                im.src = src;

        function renderGamesList(games) {
            if (!gamesListRoot) return;
            gamesListRoot.replaceChildren();
            const list = Array.isArray(games) ? games : [];
            if (list.length === 0) {
                const p = document.createElement('p');
                p.className = 'games-error';
                p.textContent = 'No games in games.json. Add entries to the "games" array.';

                return;

            list.forEach((game) => {

        async function loadGamesData(forceRefresh = false) {
            if (gamesDataLoaded && !forceRefresh) return;
            try {
                const cacheBust = forceRefresh ? `t=${Date.now()}` : '';
                const gamesJsonUrl = cacheBust ? `games.json?${cacheBust}` : 'games.json';
                const res = await fetchWithTimeout(gamesJsonUrl, { cache: 'no-store' }, 12000);
                if (!res.ok) throw new Error(String(res.status));
                const data = await res.json();
                let games = Array.isArray(data) ? data : (data.games || []);
                const withMeta = await Promise.all(
                    games.map(async (g) => {
                        const meta = await fetchGameDetailListMeta(g.detailFile, cacheBust);
                        return {
                            game: g,
                            sortYear: meta.sortYear,
                            hiddenFromHome: meta.hiddenFromHome,
                            detail: meta.detail,
                        };
                    }),
                );
                const visible = withMeta.filter((x) => !x.hiddenFromHome);
                visible.sort((a, b) => {
                    const ya = a.sortYear != null ? a.sortYear : Number.NEGATIVE_INFINITY;
                    const yb = b.sortYear != null ? b.sortYear : Number.NEGATIVE_INFINITY;
                    return yb - ya;
                });
                games = visible.map((x) => x.game);
                renderGamesList(games);
                preloadGameThumbnails(games);
                gamesDataLoaded = true;
            } catch (e) {
                console.warn(e);
                gamesDataLoaded = false;
                if (!gamesListRoot) return;
                gamesListRoot.replaceChildren();
                const p = document.createElement('p');
                p.className = 'games-error';
                p.textContent = 'Could not load games.json. Add or edit games.json in the project folder.';
                gamesListRoot.appendChild(p);
            }
        }

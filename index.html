<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fyyh</title>
    <!-- favicon.png 与 index.html 同目录（标签页图标）。本地 file:// 时部分浏览器不显示；换图后 Ctrl+F5。 -->
    <link rel="icon" type="image/png" href="favicon.png?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png?v=2">
    <meta property="og:type" content="website">
    <meta property="og:title" content="fyyh">
    <meta property="og:image" content="site-icons/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --home-nav-offset: 96px;
            /* Works 列表标题与游戏详情页标题共用同一字号 */
            --games-page-title-font-size: clamp(64px, 12vw, 132px);
        }

        html {
            overflow: hidden;
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: none !important;
        }

        html::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        
        body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overscroll-behavior: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            cursor: none !important;
        }

        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Always hide OS cursor; custom cursor follows pointer via JS */
        *,
        *::before,
        *::after {
            cursor: none !important;
        }

        #custom-cursor {
            position: fixed;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%) rotate(45deg) scale(1);
            transform-origin: 50% 50%;
            pointer-events: none;
            z-index: 30000;
            transition: transform 120ms ease;
            color: #fff;
        }

        #custom-cursor::before,
        #custom-cursor::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
        }

        #custom-cursor::before {
            width: 18px;
            height: 2px;
            background: currentColor;
        }

        #custom-cursor::after {
            width: 2px;
            height: 18px;
            background: currentColor;
        }

        #custom-cursor.active {
            transform: translate(-50%, -50%) rotate(0deg) scale(1.9);
            color: #000;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Space Mono', Consolas, monospace;
            color: #fff;
        }
        
        #loading-screen.hidden {
            display: none;
        }
        
        #loading-triangle,
        .loading-triangle {
            width: 44px;
            height: 44px;
            animation: loadingTriangleSpinPulse 1.6s ease-in-out infinite;
            transform-origin: 50% 50%;
        }

        #loading-triangle svg,
        .loading-triangle svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .subpage-triangle-loading {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            pointer-events: auto;
        }

        #games-panel-scroll,
        #contact-panel-scroll {
            position: relative;
        }

        @keyframes loadingTriangleSpinPulse {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.5);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        #entry-screen {
            position: fixed;
            inset: 0;
            background: transparent;
            color: #fff;
            z-index: 10001;
            display: none;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            font-family: 'Space Mono', Consolas, monospace;
            overflow: hidden;
        }

        #entry-screen.visible {
            display: flex;
        }

        #entry-panel {
            width: min(92vw, 560px);
            display: none;
        }

        #entry-title {
            font-size: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.04em;
        }

        #language-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .entry-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 14px;
        }

        .entry-btn.active,
        .entry-btn:hover {
            background: #fff;
            color: #000;
        }

        #entry-desc {
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 16px;
            min-height: 2.4em;
        }

        #entry-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #flat-statement {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            z-index: 10002;
            display: none;
            align-items: stretch;
            justify-content: stretch;
            font-family: 'Space Mono', Consolas, monospace;
            padding: 20px;
            gap: 16px;
        }

        #flat-statement.visible {
            display: flex;
        }

        /*
         * ASCII 全屏铺满视口，但 z-index 低于 loading / entry / 顶栏与各面板，
         * 像最底层 rendering：只在「空隙」里露出来，其余被上层盖住。
         */
        #ascii-overlay {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 9999;
            background: #000;
            pointer-events: none;
        }

        #ascii-overlay.visible {
            display: block;
        }

        #ascii-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 主页：菜单「球面」透视，由 --sphere-rx / --sphere-ry 随指针倾斜 */
        #home-nav-arena {
            --sphere-rx: 0deg;
            --sphere-ry: 0deg;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10010;
            pointer-events: none;
            perspective: min(1400px, 200vw);
            perspective-origin: 50% 42%;
        }

        #home-nav-arena.hidden {
            display: none;
        }

        #home-nav-tilt {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform: rotateX(var(--sphere-rx, 0deg)) rotateY(var(--sphere-ry, 0deg));
            transform-origin: center center;
            pointer-events: none;
        }

        #home-nav-sphere {
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        #home-nav {
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            width: min(92vw, 720px);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            transform-style: preserve-3d;
        }

        #home-nav.hidden {
            display: none;
        }

        #home-nav > .home-nav-btn {
            transform-origin: center center;
            backface-visibility: hidden;
            transition:
                color 0.12s ease,
                background-color 0.12s ease;
        }

        #home-nav > .home-nav-btn:nth-child(1) {
            transform: rotateY(26deg) translateZ(22px);
        }

        #home-nav > .home-nav-btn:nth-child(2) {
            transform: rotateY(0deg) translateZ(44px);
        }

        #home-nav > .home-nav-btn:nth-child(3) {
            transform: rotateY(-26deg) translateZ(22px);
        }

        #home-nav > .home-nav-btn:nth-child(1):hover,
        #home-nav > .home-nav-btn:nth-child(1):focus-visible {
            transform: rotateY(26deg) translateZ(22px) scale(1.02);
            outline: none;
        }

        #home-nav > .home-nav-btn:nth-child(2):hover,
        #home-nav > .home-nav-btn:nth-child(2):focus-visible {
            transform: rotateY(0deg) translateZ(44px) scale(1.02);
            outline: none;
        }

        #home-nav > .home-nav-btn:nth-child(3):hover,
        #home-nav > .home-nav-btn:nth-child(3):focus-visible {
            transform: rotateY(-26deg) translateZ(22px) scale(1.02);
            outline: none;
        }

        .home-nav-btn {
            box-sizing: border-box;
            width: fit-content;
            max-width: 100%;
            padding: 14px 22px;
            text-align: left;
            font-size: 38px;
            line-height: 1.05;
            font-family: 'Space Mono', Consolas, monospace;
            color: #fff;
            background: transparent;
            border: none;
        }

        .home-nav-btn:hover,
        .home-nav-btn:focus-visible {
            color: #000;
            background: #fff;
            outline: none;
        }

        .home-nav-btn.suppress-hover:hover,
        .home-nav-btn.suppress-hover:focus-visible {
            color: #fff;
            background: transparent;
        }

        .subpage-back-btn {
            position: absolute;
            left: max(16px, env(safe-area-inset-left, 0px));
            top: max(10px, env(safe-area-inset-top, 0px));
            width: fit-content;
            margin: 0;
            padding: 0 10px;
            border: none;
            background: transparent;
            color: #fff;
            font-family: 'Space Mono', Consolas, monospace;
            font-size: 54px;
            line-height: 1;
            z-index: 10020;
            pointer-events: auto;
        }

        .subpage-back-btn:hover,
        .subpage-back-btn:focus-visible {
            color: #000;
            background: #fff;
            outline: none;
        }

        /* About：叠在 ASCII 之上；左 about.txt，右 favicon 入口进 artist statement */
        #about-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: auto;
            box-sizing: border-box;
            padding: 0;
            background: transparent;
            color: #fff;
            z-index: 10006;
            overflow: hidden;
            display: none;
            flex-direction: column;
            align-items: stretch;
            font-family: 'Space Mono', Consolas, monospace;
            font-size: 38px;
            line-height: 1.2;
            pointer-events: none;
        }

        #about-panel.visible {
            display: flex;
        }

        #about-panel-inner {
            position: relative;
            display: flex;
            flex-direction: row;
            flex: 1 1 auto;
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
            padding: 82px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
            align-items: stretch;
            justify-content: flex-start;
            gap: 20px;
        }

        /* 左、右各占 about 内区约一半（视觉上约半屏 + 半屏） */
        .about-column--text {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            pointer-events: auto;
        }

        .about-column--statement {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            pointer-events: auto;
        }

        /* 隐形场地：menu 以下、about 文本右侧，供图标反弹运动 */
        .about-statement-playfield {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .about-text-scroll {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            flex: 1 1 auto;
            min-height: 0;
            max-height: 100%;
            padding: 20px 18px 24px;
            margin: 0;
            justify-content: flex-start;
            align-items: stretch;
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            pointer-events: auto;
        }

        /* Artist statement 入口：仅图片 hover 反色，无背景/描边框 */
        .about-statement-btn {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
            color: #fff;
            font-family: 'Space Mono', Consolas, monospace;
            cursor: none;
            z-index: 1;
            box-shadow: none;
        }

        .about-statement-btn img {
            display: block;
            width: clamp(calc(216px * 0.7), calc(36vmin * 0.7), calc(420px * 0.7));
            height: auto;
            pointer-events: none;
        }

        .about-statement-btn:hover,
        .about-statement-btn:focus-visible {
            background: transparent;
            outline: none;
        }

        .about-statement-btn:hover img,
        .about-statement-btn:focus-visible img {
            filter: invert(1);
        }

        .about-statement-btn.suppress-hover:hover,
        .about-statement-btn.suppress-hover:focus-visible {
            background: transparent;
        }

        .about-statement-btn.suppress-hover:hover img,
        .about-statement-btn.suppress-hover:focus-visible img {
            filter: none;
        }

        .about-text-root {
            margin: 0;
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            font-size: inherit;
            line-height: 1.25;
        }

        .about-text-root > .about-line {
            align-self: flex-start;
        }

        /*
         * 短行要紧贴文字宽度；勿用 width:fit-content + pre-wrap，否则会用满父级宽度（与最长行一样宽）。
         * inline-block + width:auto 用 shrink-to-fit，长行仍受 max-width:100% 限制而换行。
         */
        .about-line {
            display: inline-block;
            width: auto;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 12px 18px 14px;
            background: #000;
            color: #fff;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: inherit;
            line-height: inherit;
            vertical-align: top;
        }

        /* about.txt 里的空行：只要垂直留白，不要黑底条（避免出现「一个空格宽」的框） */
        .about-line-spacer {
            flex: 0 0 auto;
            width: 0;
            height: 12px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .side-panel-scroll {
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .side-panel-scroll::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .side-panel-scroll--about {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .side-panel-scroll--contact {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        #games-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-sizing: border-box;
            padding: 84px 28px 24px;
            background: #000;
            color: #fff;
            z-index: 10005;
            overflow: hidden;
            display: none;
            flex-direction: column;
            align-items: stretch;
            font-family: 'Space Mono', Consolas, monospace;
            font-size: 38px;
            line-height: 1.2;
        }

        #games-panel.visible {
            display: flex;
        }

        #games-panel.games-panel--detail #games-panel-scroll {
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #games-panel.games-panel--detail #games-detail-view {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #contact-panel {
            position: fixed;
            inset: 0;
            width: auto;
            box-sizing: border-box;
            padding: 84px 28px 24px;
            background: #000;
            color: #fff;
            z-index: 10005;
            overflow: hidden;
            display: none;
            flex-direction: column;
            align-items: stretch;
            font-family: 'Space Mono', Consolas, monospace;
            font-size: 38px;
            line-height: 1.2;
        }

        #contact-panel.visible {
            display: flex;
        }

        #contact-methods {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: min(92vw, 720px);
            margin: 0 auto;
            box-sizing: border-box;
        }

        #contact-methods .contact-row-btn {
            max-width: 100%;
            word-break: break-word;
            text-align: center;
        }

        #contact-methods .contact-copy-only {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        #contact-methods .contact-row-btn.contact-linkedin-expanded {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        #copy-toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 40000;
            padding: 18px 36px;
            background: #fff;
            color: #000;
            font-family: 'Space Mono', Consolas, monospace;
            font-size: 28px;
            line-height: 1.2;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.1s ease;
        }

        #copy-toast.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Works 列表：纵向滚动；flex 子项须 min-width:0 才能在面板内正确纵向 overflow */
        #games-panel:not(.games-panel--detail) #games-panel-scroll {
            min-width: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #games-list-view {
            min-height: 0;
        }

        #games-list-root {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px 20px;
            padding: 8px 4px 28px;
            align-items: start;
            width: 100%;
            box-sizing: border-box;
        }

        #games-list-root > .games-error {
            grid-column: 1 / -1;
        }

        .games-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 12px 10px 16px;
            font-family: inherit;
            font-size: 38px;
            line-height: 1.2;
            color: #fff;
            background: transparent;
            border: none;
            text-align: center;
            appearance: none;
            overflow: visible;
        }

        /* 与缩略图之间的剩余高度里，把标题垂直居中（配合 equalize 的 min-height） */
        .games-row-title-slot {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .games-row:hover,
        .games-row:focus-visible {
            color: #000;
            background: #fff;
            outline: none;
        }

        .games-row-title {
            margin: 0;
            width: 100%;
            font-weight: normal;
            font-size: var(--games-page-title-font-size);
            line-height: 0.95;
            text-align: center;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: 100%;
            overflow: visible;
        }

        .games-row-media {
            flex: 0 0 auto;
            width: 100%;
            height: 66.666vh;
            max-height: 66.666vh;
            min-height: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .games-row-media img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .games-row:hover .games-row-media img,
        .games-row:focus-visible .games-row-media img {
            filter: invert(1);
        }

        .games-row-media--empty {
            min-height: 66.666vh;
            border: 1px dashed rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
        }

        .games-row:hover .games-row-media--empty,
        .games-row:focus-visible .games-row-media--empty {
            border-color: rgba(0, 0, 0, 0.35);
            background: rgba(0, 0, 0, 0.06);
        }

        .games-error {
            font-size: 28px;
            line-height: 1.35;
            opacity: 0.9;
            margin: 0;
        }

        .games-detail-header {
            margin: 0;
            padding: 0 0 72px;
            flex: 0 0 auto;
        }

        .games-detail-title {
            margin: 0;
            font-family: inherit;
            font-size: var(--games-page-title-font-size);
            line-height: 0.95;
            font-weight: normal;
            color: #fff;
            text-align: center;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .games-detail-subline {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: start;
            justify-items: center;
            gap: 6px 30px;
            margin: 0;
            padding: 0 0 14px;
            font-size: 19px;
            line-height: 1.45;
            color: #fff;

    <div aria-hidden="true" style="position:absolute;left:0;top:0;width:0;height:0;margin:0;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);font-family:'Space Mono',monospace;">.</div>
    <script>
        // App shell management
        const loadingScreen = document.getElementById('loading-screen');
        const entryScreen = document.getElementById('entry-screen');
        const entryTitle = document.getElementById('entry-title');
        const entryDesc = document.getElementById('entry-desc');
        const startBtn = document.getElementById('start-btn');
        const asciiBtn = document.getElementById('ascii-btn');
        const flatStatement = document.getElementById('flat-statement');
        const leftFlatCanvas = document.getElementById('left-flat-canvas');
        const rightFlatCanvas = document.getElementById('right-flat-canvas');
        const leftControls = document.getElementById('left-controls');
        const leftPrompt = document.getElementById('left-prompt');
        const leftPromptText = document.getElementById('left-prompt-text');
        const leftYesBtn = document.getElementById('left-yes-btn');
        const leftNoBtn = document.getElementById('left-no-btn');
        const rightControls = document.getElementById('right-controls');
        const rightInput = document.getElementById('right-input');
        const rightOpt1 = document.getElementById('right-opt-1');
        const rightOpt2 = document.getElementById('right-opt-2');
        const rightOpt3 = document.getElementById('right-opt-3');
        const rightContinueBtn = document.getElementById('right-continue-btn');
        const asciiOverlay = document.getElementById('ascii-overlay');
        const asciiCanvas = document.getElementById('ascii-canvas');
        const langZhBtn = document.getElementById('lang-zh');
        const langEnBtn = document.getElementById('lang-en');
        const homeAboutBtn = document.getElementById('home-about');
        const homeGamesBtn = document.getElementById('home-games');
        const homeContactBtn = document.getElementById('home-contact');
        const homeNav = document.getElementById('home-nav');
        const homeNavArena = document.getElementById('home-nav-arena');
        const aboutPanel = document.getElementById('about-panel');
        const aboutPanelInner = document.getElementById('about-panel-inner');
        const aboutBackBtn = document.getElementById('about-back-btn');
        const aboutTextEl = document.getElementById('about-text');
        const aboutStatementBtn = document.getElementById('about-statement-btn');
        const aboutStatementPlayfield = document.getElementById('about-statement-playfield');

        const ABOUT_STATEMENT_FLOAT_SPEED = 32;
        const ABOUT_STATEMENT_DODGE_COUNT = 3;
        /** 闪避时新位置相对旧位置的最小位移：约为场地可移动对角线的一大部分（达不到时再放宽） */
        const ABOUT_STATEMENT_MIN_DODGE_FRAC = 0.52;
        let aboutStatementDodgesLeft = 0;
        let aboutStatementFloatRaf = 0;
        let aboutStatementFloatLast = 0;
        let aboutStatementVx = 0;
        let aboutStatementVy = 0;
        let aboutStatementFloatActive = false;

        function clampAboutStatementBtnToPlayfield() {
            if (!aboutStatementBtn || !aboutStatementPlayfield) return;
            const fw = aboutStatementPlayfield.clientWidth;
            const fh = aboutStatementPlayfield.clientHeight;
            const bw = aboutStatementBtn.offsetWidth;
            const bh = aboutStatementBtn.offsetHeight;
            const maxX = Math.max(0, fw - bw);
            const maxY = Math.max(0, fh - bh);
            const x = Math.min(maxX, Math.max(0, parseFloat(aboutStatementBtn.style.left) || 0));
            const y = Math.min(maxY, Math.max(0, parseFloat(aboutStatementBtn.style.top) || 0));
            aboutStatementBtn.style.left = `${x}px`;
            aboutStatementBtn.style.top = `${y}px`;
        }

        function initAboutStatementFloatPosition() {
            if (!aboutStatementBtn || !aboutStatementPlayfield) return;
            clampAboutStatementBtnToPlayfield();
            const fw = aboutStatementPlayfield.clientWidth;
            const fh = aboutStatementPlayfield.clientHeight;
            const bw = aboutStatementBtn.offsetWidth;
            const bh = aboutStatementBtn.offsetHeight;
            const maxX = Math.max(0, fw - bw);
            const maxY = Math.max(0, fh - bh);
            aboutStatementBtn.style.left = `${Math.random() * maxX}px`;
            aboutStatementBtn.style.top = `${Math.random() * maxY}px`;
        }

        function resetAboutStatementDodges() {
            aboutStatementDodgesLeft = ABOUT_STATEMENT_DODGE_COUNT;
        }

        /** 将按钮瞬移到 playfield 内、不包含 (plx, ply) 的矩形（首次 dodge 实现，无插值动画） */
        function teleportAboutStatementAwayFrom(plx, ply) {
            if (!aboutStatementBtn || !aboutStatementPlayfield) return;
            const fw = aboutStatementPlayfield.clientWidth;
            const fh = aboutStatementPlayfield.clientHeight;
            const bw = aboutStatementBtn.offsetWidth;
            const bh = aboutStatementBtn.offsetHeight;
            const maxX = Math.max(0, fw - bw);
            const maxY = Math.max(0, fh - bh);
            const ox = parseFloat(aboutStatementBtn.style.left) || 0;
            const oy = parseFloat(aboutStatementBtn.style.top) || 0;
            const ocx = ox + bw * 0.5;
            const ocy = oy + bh * 0.5;
            const maxCenterSpan = Math.hypot(Math.max(0, fw - bw), Math.max(0, fh - bh));
            const minDodgeBase =
                maxCenterSpan > 0
                    ? Math.min(
                          maxCenterSpan * 0.95,
                          Math.max((bw + bh) * 0.55, maxCenterSpan * ABOUT_STATEMENT_MIN_DODGE_FRAC)
                      )
                    : 0;
            const inside = (nx, ny) =>
                plx >= nx && plx <= nx + bw && ply >= ny && ply <= ny + bh;
            const centerDistSq = (nx, ny) => {
                const ncx = nx + bw * 0.5;
                const ncy = ny + bh * 0.5;
                const dx = ncx - ocx;
                const dy = ncy - ocy;
                return dx * dx + dy * dy;
            };
            const tryPick = (minDist, randomTries) => {
                const minSq = minDist * minDist;
                const ok = (nx, ny) =>
                    !inside(nx, ny) && (minDist <= 0 || centerDistSq(nx, ny) >= minSq);
                let nx = 0;
                let ny = 0;
                for (let i = 0; i < randomTries; i++) {
                    nx = Math.random() * maxX;
                    ny = Math.random() * maxY;
                    if (ok(nx, ny)) return { nx, ny };
                }
                const corners = [
                    [0, 0],
                    [maxX, 0],
                    [0, maxY],
                    [maxX, maxY]
                ];
                corners.sort(
                    (a, b) =>
                        centerDistSq(b[0], b[1]) - centerDistSq(a[0], a[1])
                );
                for (let ci = 0; ci < corners.length; ci++) {
                    nx = corners[ci][0];
                    ny = corners[ci][1];
                    if (ok(nx, ny)) return { nx, ny };
                }
                return null;
            };
            const relaxSteps = [minDodgeBase, minDodgeBase * 0.55, minDodgeBase * 0.22, 0];
            let picked = null;
            for (let s = 0; s < relaxSteps.length && !picked; s++) {
                picked = tryPick(relaxSteps[s], s === 0 ? 72 : 32);
            }
            let nx = 0;
            let ny = 0;
            if (picked) {
                nx = picked.nx;
                ny = picked.ny;
            } else {
                nx = plx < fw / 2 ? maxX : 0;
                ny = ply < fh / 2 ? maxY : 0;
            }
            aboutStatementBtn.style.left = `${nx}px`;
            aboutStatementBtn.style.top = `${ny}px`;
            const angle = Math.random() * Math.PI * 2;
            aboutStatementVx = Math.cos(angle) * ABOUT_STATEMENT_FLOAT_SPEED;
            aboutStatementVy = Math.sin(angle) * ABOUT_STATEMENT_FLOAT_SPEED;
        }

        function tryAboutStatementPointerDodge(event) {
            if (!aboutStatementBtn || !aboutStatementPlayfield) return;
            if (aboutStatementDodgesLeft <= 0) return;
            if (!aboutPanel.classList.contains('visible')) return;
            const rect = aboutStatementPlayfield.getBoundingClientRect();
            const plx = event.clientX - rect.left;
            const ply = event.clientY - rect.top;
            aboutStatementDodgesLeft--;
            teleportAboutStatementAwayFrom(plx, ply);
        }

        function stopAboutStatementFloat() {
            aboutStatementFloatActive = false;
            if (aboutStatementFloatRaf) {
                cancelAnimationFrame(aboutStatementFloatRaf);
                aboutStatementFloatRaf = 0;
            }
        }

        function tickAboutStatementFloat(now) {
            if (!aboutStatementFloatActive) return;
            if (!aboutPanel || !aboutPanel.classList.contains('visible')) {
                stopAboutStatementFloat();
                return;
            }
            if (!aboutStatementBtn || !aboutStatementPlayfield) {
                stopAboutStatementFloat();
                return;
            }
            const dt = Math.min(0.05, Math.max(0, (now - aboutStatementFloatLast) / 1000));
            aboutStatementFloatLast = now;

            const fw = aboutStatementPlayfield.clientWidth;
            const fh = aboutStatementPlayfield.clientHeight;
            const bw = aboutStatementBtn.offsetWidth;
            const bh = aboutStatementBtn.offsetHeight;
            const maxX = Math.max(0, fw - bw);
            const maxY = Math.max(0, fh - bh);
            if (maxX <= 0) aboutStatementVx = 0;
            if (maxY <= 0) aboutStatementVy = 0;

            let x = parseFloat(aboutStatementBtn.style.left) || 0;
            let y = parseFloat(aboutStatementBtn.style.top) || 0;

            x += aboutStatementVx * dt;
            y += aboutStatementVy * dt;

            if (x <= 0) {
                x = 0;
                aboutStatementVx *= -1;
            } else if (x >= maxX) {
                x = maxX;
                aboutStatementVx *= -1;
            }
            if (y <= 0) {
                y = 0;
                aboutStatementVy *= -1;
            } else if (y >= maxY) {
                y = maxY;
                aboutStatementVy *= -1;
            }

            aboutStatementBtn.style.left = `${x}px`;
            aboutStatementBtn.style.top = `${y}px`;

            aboutStatementFloatRaf = requestAnimationFrame(tickAboutStatementFloat);
        }

        function startAboutStatementFloat() {
            stopAboutStatementFloat();
            if (!aboutStatementBtn || !aboutStatementPlayfield) return;
            if (!aboutPanel.classList.contains('visible')) return;
            const angle = Math.random() * Math.PI * 2;
            aboutStatementVx = Math.cos(angle) * ABOUT_STATEMENT_FLOAT_SPEED;
            aboutStatementVy = Math.sin(angle) * ABOUT_STATEMENT_FLOAT_SPEED;
            aboutStatementFloatLast = performance.now();
            aboutStatementFloatActive = true;
            aboutStatementFloatRaf = requestAnimationFrame(tickAboutStatementFloat);
        }

        function scheduleAboutStatementFloatStart() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    initAboutStatementFloatPosition();
                    // Reveal only after new start position is committed to avoid one-frame jump flash.
                    if (aboutStatementBtn) aboutStatementBtn.style.visibility = 'visible';
                    startAboutStatementFloat();
                });
            });
        }

        if (aboutStatementPlayfield && typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => {
                if (!aboutPanel || !aboutPanel.classList.contains('visible')) return;
                clampAboutStatementBtnToPlayfield();
            }).observe(aboutStatementPlayfield);
        }
        const gamesPanel = document.getElementById('games-panel');
        const gamesBackBtn = document.getElementById('games-back-btn');
        const gamesPanelScroll = document.getElementById('games-panel-scroll');
        const gamesListView = document.getElementById('games-list-view');
        const gamesListRoot = document.getElementById('games-list-root');
        const gamesDetailView = document.getElementById('games-detail-view');
        const gamesDetailBody = document.getElementById('games-detail-body');
        let gameDetailOpSeq = 0;
        const contactPanel = document.getElementById('contact-panel');
        const contactBackBtn = document.getElementById('contact-back-btn');
        const contactPanelScroll = document.getElementById('contact-panel-scroll');
        const contactMethods = document.getElementById('contact-methods');
        const customCursor = document.getElementById('custom-cursor');
        
        // Global audio context for typewriter sounds (initialized before statement starts)
        let globalAudioContext = null;
        let appStarted = false;
        let currentLanguage = 'en';
        let resourcesReady = false;
        const minLoadingDurationMs = 1600; // one full triangle spin
        const loadingStartedAt = performance.now();

        // External language packs.
        const languagePacks = { en: null, zh: null };

        const DEFAULT_FETCH_TIMEOUT_MS = 14000;

        async function fetchWithTimeout(resource, init = {}, timeoutMs = DEFAULT_FETCH_TIMEOUT_MS) {
            const controller = new AbortController();
            const tid = window.setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(resource, { ...init, signal: controller.signal });
            } finally {
                window.clearTimeout(tid);
            }
        }

        async function loadLanguagePack(lang) {
            if (languagePacks[lang]) return languagePacks[lang];
            try {
                const response = await fetchWithTimeout(`i18n/artist-statement.${lang}.json`, {}, DEFAULT_FETCH_TIMEOUT_MS);
                if (!response.ok) throw new Error(`lang ${lang} load failed: ${response.status}`);
                const json = await response.json();
                languagePacks[lang] = json;
                return json;
            } catch (error) {
                console.warn(`Failed to load language pack "${lang}":`, error);
                return null;
            }
        }

        function getShell(lang) {
            const enShell = (languagePacks.en && languagePacks.en.shell) || {};
            const curShell = (languagePacks[lang] && languagePacks[lang].shell) || {};
            return { ...enShell, ...curShell };
        }

        // Statement text accessor (ready for future flat-page renderer).
        function getStatementText(path, fallback) {

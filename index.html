                if (!btn || !contactConfig) return;
                const kind = btn.dataset.contact;
                const cfg = contactConfig;
                if (kind === 'email') {
                    const em = (cfg.email || '').trim();
                    btn.textContent = em || '—';
                    if (em) void copyWithCopiedToast(em);
                    return;
                }
                if (kind === 'discord') {
                    openContactExternalUrl(cfg.discordUrl);
                    return;
                }
                if (kind === 'linkedin') {
                    const stage = btn.dataset.linkedinStage || '0';
                    const line2Text = (cfg.linkedinSecondLine || '').trim();
                    const url = (cfg.linkedinUrl || '').trim();

                    if (stage === '2' && url) {
                        openContactExternalUrl(cfg.linkedinUrl);
                        return;
                    }

                    if (stage === '0') {
                        const t1 = (cfg.linkedinText || '').trim() || '—';
                        btn.dataset.linkedinStage = '1';
                        btn.classList.add('contact-linkedin-expanded');
                        btn.replaceChildren();
                        const l1 = document.createElement('div');
                        l1.className = 'linkedin-line1';
                        l1.textContent = t1;
                        btn.appendChild(l1);
                        if (line2Text && url) {
                            const l2 = document.createElement('div');
                            l2.className = 'linkedin-line2';
                            l2.hidden = true;
                            l2.textContent = line2Text;
                            btn.appendChild(l2);
                        }
                        return;
                    }
                    if (stage === '1') {
                        const l2 = btn.querySelector('.linkedin-line2');
                        if (l2 && l2.hidden) {
                            l2.hidden = false;
                            btn.dataset.linkedinStage = '2';
                        }
                        return;
                    }
                    return;
                }
                if (kind === 'wechat') {
                    const wx = (cfg.wechatText || '').trim();
                    btn.textContent = wx || '—';
                    if (wx) void copyWithCopiedToast(wx);
                    return;
                }
                if (kind === 'steam') {
                    openContactExternalUrl(cfg.steamUrl);
                }
            });
        }

        const SIDE_PANEL_SWAP_Z = 10007;

        homeAboutBtn.addEventListener('click', async () => {
            if (!resourcesReady) return;
            setHomeNavVisible(false);
            resetAboutStatementDodges();
            updateHomeNavOffset();
            if (aboutStatementBtn) aboutStatementBtn.style.visibility = 'hidden';
            aboutPanel.style.zIndex = String(SIDE_PANEL_SWAP_Z);
            aboutPanel.classList.add('visible');
            aboutPanel.setAttribute('aria-hidden', 'false');
            if (gamesPanel) {
                gamesPanel.classList.remove('visible');
                gamesPanel.setAttribute('aria-hidden', 'true');
                showGamesListView();
            }
            closeContactPanel();
            const aboutOverlay = aboutPanelInner ? createSubpageTriangleLoadingOverlay() : null;
            if (aboutOverlay) aboutPanelInner.appendChild(aboutOverlay);
            try {
                await loadAboutText();
                await startAsciiOverlayAnimation({ forceReset: true });
            } catch (e) {
                console.error(e);
                alert(currentLanguage === 'zh' ? '无法加载 me.txt' : 'Failed to load me.txt');
            } finally {
                if (aboutOverlay && aboutOverlay.parentNode) aboutOverlay.remove();
            }
            aboutPanel.style.zIndex = '';
            scheduleAboutStatementFloatStart();
        });

        homeGamesBtn.addEventListener('click', async () => {
            if (!resourcesReady || !gamesPanel) return;
            setHomeNavVisible(false);
            showGamesListView();
            gamesPanel.style.zIndex = String(SIDE_PANEL_SWAP_Z);
            gamesPanel.classList.add('visible');
            gamesPanel.setAttribute('aria-hidden', 'false');
            hideAsciiOverlayAndStopAnimation();
            aboutPanel.classList.remove('visible');
            aboutPanel.setAttribute('aria-hidden', 'true');
            closeContactPanel();
            const gamesNeedsLoad = !gamesDataLoaded;
            const gamesOverlay = gamesNeedsLoad && gamesPanelScroll ? createSubpageTriangleLoadingOverlay() : null;
            if (gamesOverlay) gamesPanelScroll.appendChild(gamesOverlay);
            try {
                await loadGamesData(false);
            } finally {
                if (gamesOverlay && gamesOverlay.parentNode) gamesOverlay.remove();
            }
            gamesPanel.style.zIndex = '';
            syncFitGamesOverviewIfVisible();
            scheduleFitGamesOverviewTitles();
        });

        if (aboutBackBtn) {
            aboutBackBtn.addEventListener('click', () => {
                showMainPage();
            });
        }

        if (gamesBackBtn) {
            gamesBackBtn.addEventListener('click', () => {
                if (gamesDetailView && !gamesDetailView.hidden) {
                    showGamesListView();
                    return;
                }
                showMainPage();
            });
        }

        if (contactBackBtn) {
            contactBackBtn.addEventListener('click', () => {
                showMainPage();
            });
        }

        window.addEventListener('resize', onGamesTitleFitResize);

        homeContactBtn.addEventListener('click', async () => {
            if (!resourcesReady || !contactPanel) return;
            const isOpen = contactPanel.classList.contains('visible');
            if (isOpen) {
                closeContactPanel();
                setHomeNavVisible(true);
                return;
            }
            setHomeNavVisible(false);
            contactPanel.style.zIndex = String(SIDE_PANEL_SWAP_Z);
            contactPanel.classList.add('visible');
            contactPanel.setAttribute('aria-hidden', 'false');
            hideAsciiOverlayAndStopAnimation();
            aboutPanel.classList.remove('visible');
            aboutPanel.setAttribute('aria-hidden', 'true');
            if (gamesPanel) {
                gamesPanel.classList.remove('visible');
                gamesPanel.setAttribute('aria-hidden', 'true');
                showGamesListView();
            }
            const contactNeedsLoad = !contactConfigInitialized;
            const contactOverlay = contactNeedsLoad && contactPanelScroll ? createSubpageTriangleLoadingOverlay() : null;
            if (contactOverlay) contactPanelScroll.appendChild(contactOverlay);
            try {
                await loadContactConfig();
                resetContactButtonLabels();
            } finally {
                if (contactOverlay && contactOverlay.parentNode) contactOverlay.remove();
            }
            contactPanel.style.zIndex = '';
            if (contactPanelScroll) contactPanelScroll.scrollTop = 0;
        });
        [homeAboutBtn, homeGamesBtn, homeContactBtn].forEach((btn) => {
            if (!btn) return;
            btn.addEventListener('click', () => {
                btn.classList.add('suppress-hover');
            });
            btn.addEventListener('mousemove', () => {
                btn.classList.remove('suppress-hover');
            });
            btn.addEventListener('mouseleave', () => {
                btn.classList.remove('suppress-hover');
            });
        });

        if (aboutStatementBtn) {
            aboutStatementBtn.addEventListener('pointerenter', (e) => {
                tryAboutStatementPointerDodge(e);
            });
            aboutStatementBtn.addEventListener('click', () => {
                aboutStatementBtn.classList.add('suppress-hover');
                void openArtistStatementFromAbout();
            });
            aboutStatementBtn.addEventListener('mousemove', () => {
                aboutStatementBtn.classList.remove('suppress-hover');
            });
            aboutStatementBtn.addEventListener('mouseleave', () => {
                aboutStatementBtn.classList.remove('suppress-hover');
            });
        }

        updateHomeNavOffset();
        window.addEventListener('resize', () => {
            updateHomeNavOffset();
        });

        function handleLeftChoice(choice) {
            const c = (choice || '').toLowerCase().trim();
            if (leftPhase === 'options1') {
                const commitInputLine = (line) => {
                    flatState.leftActive.push(line);
                    leftRenderedLines[flatState.leftActive.length - 1] = line;
                    leftLineIndex = flatState.leftActive.length;
                    leftCharIndex = 0;
                    leftLastTick = performance.now() + 260;
                };
                if (c === 'yes') {
                    commitInputLine('>yes');
                    returnArtistStatementToAbout();
                    return;
                }
                if (c === 'no') {
                    commitInputLine('>no');
                    flatState.leftActive.push(...flatState.leftNoResponse);
                    leftPhaseEnd = flatState.leftActive.length;
                    leftPhase = 'noResponse';
                    toggleControls();
                    return;
                }
            } else if (leftPhase === 'options2') {
                // REQUIRED behavior:
                // yes -> continue dialogue
                // no  -> return to main page
                if (c === 'yes') {
                    leftFinalChoice = 'yes';
                    const choiceIndex = flatState.leftActive.length;
                    flatState.leftActive.push('yes');
                    // Render selected option immediately (not character-by-character).
                    leftRenderedLines[choiceIndex] = 'yes';
                    flatState.leftActive.push(...flatState.leftFinalContinue);
                    leftPhaseEnd = flatState.leftActive.length;
                    // Move cursor to next line with the same line-height rhythm.
                    leftLineIndex = choiceIndex + 1;
                    leftCharIndex = 0;
                    leftLastTick = performance.now() + 700;
                    leftPhase = 'finalContinue';
                    toggleControls();
                    return;
                }
                if (c === 'no') {
                    leftFinalChoice = 'no';
                    flatState.leftActive.push('no');
                    leftPhaseEnd = flatState.leftActive.length;
                    returnArtistStatementToAbout();
                    return;
                }
                return;
            } else if (leftPhase === 'hiringOptions') {
                // Keep same input logic style as current: only expected answer advances.
                if (c === 'no') {
                    const choiceIndex = flatState.leftActive.length;
                    flatState.leftActive.push('>no');
                    leftRenderedLines[choiceIndex] = '>no';
                    flatState.leftActive.push(...flatState.leftHiringResponse);
                    leftPhaseEnd = flatState.leftActive.length;
                    leftLineIndex = choiceIndex + 1;
                    leftCharIndex = 0;
                    leftLastTick = performance.now() - 1000;
                    leftPhase = 'hiringResponse';
                    leftHiringInput = '';
                    toggleControls();
                }
                return;
            }
        }

        function handleRightChoice(choice) {
            const c = String(choice || '').trim().toLowerCase();
            if (rightPhase === 'options1') {
                if (c === '1') {
                    const choiceIndex = flatState.rightActive.length;
                    flatState.rightActive.push('>1');
                    rightRenderedLines[choiceIndex] = '>1';
                    rightLineIndex = flatState.rightActive.length;
                    rightCharIndex = 0;
                    rightLastTick = performance.now() + 260;
                    flatState.rightActive.push(...flatState.rightResponse1);
                    rightPhaseEnd = flatState.rightActive.length;
                    rightPhase = 'response1';
                    rightUserInput = '';
                    toggleControls();
                }
            } else if (rightPhase === 'options2') {
                if (c === 'line-click') {
                    const choiceIndex = flatState.rightActive.length;
                    flatState.rightActive.push('>continue');
                    rightRenderedLines[choiceIndex] = '>continue';
                    rightLineIndex = flatState.rightActive.length;
                    rightCharIndex = 0;
                    rightLastTick = performance.now() + 260;
                    flatState.rightActive.push(...flatState.rightFinal);
                    rightPauseAtIndex = flatState.rightActive.findIndex((line) => line === 'Seriously, thank you.');
                    rightPausedForLeft = false;
                    rightPhaseEnd = flatState.rightActive.length;
                    rightPhase = 'final';
                    rightUserInput = '';
                    toggleControls();
                }
            }
        }

        function maybeShowRightOptions2HintFromSubmission(submittedText) {
            if (rightPhase !== 'options2' || rightOptions2HintShown || !flatState) return;
            const normalized = String(submittedText || '').trim();
            if (normalized === '1') rightOptions2Saw1 = true;
            else if (normalized === '2') rightOptions2Saw2 = true;
            else if (normalized === '3') rightOptions2Saw3 = true;
            if (!(rightOptions2Saw1 && rightOptions2Saw2 && rightOptions2Saw3)) return;
            rightOptions2HintShown = true;
            const lineIndex = flatState.rightActive.length;
            flatState.rightActive.push(RIGHT_OPTIONS2_HINT_LINE);
            rightRenderedLines[lineIndex] = RIGHT_OPTIONS2_HINT_LINE;
            rightScrollOffset = Number.MAX_SAFE_INTEGER;
        }

        leftFlatCanvas.addEventListener('mousemove', (event) => {
            if (!flatStatement.classList.contains('visible')) return;
            syncCursorHoverAtPoint(event.clientX, event.clientY);
        });
        leftFlatCanvas.addEventListener('click', (event) => {
            if (!flatStatement.classList.contains('visible')) return;
            const rect = leftFlatCanvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            if (leftPhase === 'options2' && leftYesHitRect && x >= leftYesHitRect.x && x <= leftYesHitRect.x + leftYesHitRect.w && y >= leftYesHitRect.y && y <= leftYesHitRect.y + leftYesHitRect.h) {
                handleLeftChoice('yes');
            } else if (leftPhase === 'options2' && leftNoHitRect && x >= leftNoHitRect.x && x <= leftNoHitRect.x + leftNoHitRect.w && y >= leftNoHitRect.y && y <= leftNoHitRect.y + leftNoHitRect.h) {
                handleLeftChoice('no');
            } else if (
                leftPhase === 'done' &&
                leftBackHitRect &&
                x >= leftBackHitRect.x &&
                x <= leftBackHitRect.x + leftBackHitRect.w &&
                y >= leftBackHitRect.y &&
                y <= leftBackHitRect.y + leftBackHitRect.h
            ) {
                returnArtistStatementToAbout();
            }
        });
        rightFlatCanvas.addEventListener('mousemove', (event) => {
            if (!flatStatement.classList.contains('visible') || rightPhase !== 'options2') return;
            syncCursorHoverAtPoint(event.clientX, event.clientY);
        });
        rightFlatCanvas.addEventListener('mouseleave', () => {
            rightClickableLineHovered = false;
            cursorCanvasHover = !!(leftHoveredChoice || leftBackHovered);
            refreshCustomCursorState();
        });
        leftFlatCanvas.addEventListener('mouseleave', () => {
            leftHoveredChoice = '';
            leftBackHovered = false;
            cursorCanvasHover = !!rightClickableLineHovered;
            refreshCustomCursorState();
        });
        rightFlatCanvas.addEventListener('click', (event) => {
            if (!flatStatement.classList.contains('visible') || rightPhase !== 'options2') return;
            const rect = rightFlatCanvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            if (
                rightClickableLineRect &&
                x >= rightClickableLineRect.x &&
                x <= rightClickableLineRect.x + rightClickableLineRect.w &&
                y >= rightClickableLineRect.y &&
                y <= rightClickableLineRect.y + rightClickableLineRect.h
            ) {
                handleRightChoice('line-click');
            }
        });
        document.addEventListener('keydown', (event) => {
            if (!flatStatement.classList.contains('visible')) return;
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            if (rightPhase === 'options1' || rightPhase === 'options2') {
                if (event.key === 'Backspace') {
                    rightUserInput = rightUserInput.slice(0, -1);
                    event.preventDefault();
                    return;
                }
                if (event.key === 'Enter') {
                    if (rightPhase === 'options1') {
                        handleRightChoice(rightUserInput);
                    } else if (rightPhase === 'options2') {
                        maybeShowRightOptions2HintFromSubmission(rightUserInput);
                    }
                    rightUserInput = '';
                    event.preventDefault();
                    return;
                }
                if (event.key.length === 1) {
                    rightUserInput += event.key;
                    event.preventDefault();
                    return;
                }
            }
            if (leftPhase !== 'options1' && leftPhase !== 'hiringOptions') return;
            if (event.key === 'Backspace') {
                if (leftPhase === 'options1') leftUserInput = leftUserInput.slice(0, -1);
                else leftHiringInput = leftHiringInput.slice(0, -1);
                leftPromptText.textContent = leftUserInput;
                event.preventDefault();
                return;
            }
            if (event.key === 'Enter') {
                if (leftPhase === 'options1') {
                    const normalized = leftUserInput.trim().toLowerCase();
                    if (normalized === 'yes' || normalized === 'no') {
                        handleLeftChoice(normalized);
                    }
                    leftUserInput = '';
                    leftPromptText.textContent = '';
                } else if (leftPhase === 'hiringOptions') {
                    handleLeftChoice(leftHiringInput.trim().toLowerCase());
                    leftHiringInput = '';
                }
                event.preventDefault();
                return;
            }
            if (event.key.length === 1) {
                if (leftPhase === 'options1') leftUserInput += event.key;
                else leftHiringInput += event.key;
                leftPromptText.textContent = leftUserInput;
                event.preventDefault();
            }
        });

        asciiBtn.addEventListener('click', async () => {
            if (!resourcesReady) return;
            try {
                await startAsciiOverlayAnimation();
            } catch (error) {
                console.error(error);
                alert(currentLanguage === 'zh' ? '无法加载 me.txt' : 'Failed to load me.txt');
            }
        });

        // Start initialization immediately (script runs after DOM is ready)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            // DOM already loaded, start immediately
            initializeApp();
        }
        
        
    </script>
</body>
</html>
